<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 - 後台管理系統</title>
<link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">A</div>
            <h1>後台管理系統</h1>
            <p>請登入以繼續使用管理後台</p>
        </div>

        <p id="errorMsg" class="error-message" hidden></p>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">帳號</label>
                <input type="text" id="username" name="username" placeholder="請輸入帳號" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" placeholder="請輸入密碼" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember-me">
                    <span>記住我</span>
                </label>
                <a href="#" class="forgot-link">忘記密碼？</a>
            </div>

            <button type="submit" class="login-button">登入</button>
        </form>

        <p class="login-footer">&copy; 2026 後台管理系統</p>
    </div>
</div>
<script src="/js/csrf.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
